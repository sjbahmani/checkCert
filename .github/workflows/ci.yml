name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash -n checkCRT.sh
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: .
      - name: Run CLI regression tests
        run: ./tests/test_cli.sh
      - name: Run functional tests (local PKI, no network required)
        run: ./tests/functional/run.sh
