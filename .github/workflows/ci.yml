name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Bash syntax
        run: bash -n checkCRT.sh
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: .
      - name: Run CLI regression tests
        run: ./tests/test_cli.sh
      - name: Install functional test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq busybox-static
      - name: Run functional tests (local PKI, no network required)
        run: |
          openssl version -a
          ./tests/functional/run.sh
