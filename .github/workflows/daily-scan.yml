name: Daily Iran hosts scan

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run batch check
        id: scan
        run: |
          mkdir -p reports
          report="reports/$(date -u +%Y-%m-%d).txt"
          ./checkCRT.sh --hosts-file examples/hosts-iran.txt --parallel 10 > "$report" 2>&1 || true
          echo "report=$report" >> "$GITHUB_OUTPUT"

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.scan.outputs.report }}"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily scan: $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
